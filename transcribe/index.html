<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Transcriber AI - Groq Direct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #11141a 0%, #171b26 50%, #1f2436 100%);
        }
        .serif-font { font-family: 'Source Serif 4', serif; }
        .liquid-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .liquid-glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-indigo-500/30">

    <header class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
            <span class="text-xs font-semibold tracking-widest uppercase text-slate-400">Groq Client Engine</span>
        </div>
        
        <button id="toggle-sidebar" class="liquid-glass hover:bg-white/10 text-white px-4 py-2.5 rounded-full flex items-center gap-2 transition-all duration-300 transform hover:scale-105 active:scale-95 group">
            <i data-lucide="sparkles" class="w-4 h-4 text-indigo-400 group-hover:rotate-12 transition-transform"></i>
            <span class="text-sm font-medium">Refinar com Llama 3.1</span>
        </button>
    </header>

    <main class="flex-1 w-full max-w-4xl mx-auto px-6 flex flex-col justify-center items-center my-4 z-10">
        <div class="w-full min-h-[350px] max-h-[550px] overflow-y-auto rounded-3xl p-8 liquid-glass flex flex-col justify-between transition-all duration-500" id="transcription-container">
            <div id="placeholder-text" class="flex flex-col items-center justify-center text-center my-auto text-slate-400">
                <div class="p-4 bg-indigo-500/10 rounded-full mb-4">
                    <i data-lucide="mic" class="w-8 h-8 text-indigo-400"></i>
                </div>
                <h2 class="text-xl font-medium text-slate-200 mb-1">Pronto para Gravar</h2>
                <p class="text-sm max-w-xs text-slate-500">O Whisper traduzirá sua voz e o Llama estruturará o layout.</p>
            </div>
            
            <div id="transcription-result" class="serif-font hidden prose prose-invert max-w-none text-slate-200 text-lg leading-relaxed space-y-4"></div>

            <div id="loading-transcription" class="hidden flex-col items-center justify-center text-center my-auto py-8">
                <div class="relative w-12 h-12 mb-4">
                    <div class="absolute inset-0 border-4 border-indigo-500/20 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-t-indigo-400 rounded-full animate-spin"></div>
                </div>
                <p class="text-sm text-indigo-300 font-medium animate-pulse">Groq processando áudio e texto...</p>
            </div>
        </div>
    </main>

    <div class="w-full max-w-2xl mx-auto px-6 pb-12 z-10">
        <div class="liquid-glass rounded-full px-4 py-3 flex items-center justify-between gap-4 transition-all duration-300" id="audio-pill">
            <button id="btn-record" class="w-12 h-12 rounded-full bg-indigo-600 hover:bg-indigo-500 flex items-center justify-center text-white shadow-lg transition-all transform active:scale-95 duration-200">
                <i data-lucide="play" id="icon-record" class="w-5 h-5 fill-white ml-0.5"></i>
            </button>
            <div class="flex-1 h-12 relative flex items-center justify-center overflow-hidden">
                <canvas id="waveform-canvas" class="w-full h-8 opacity-80"></canvas>
            </div>
            <div class="text-slate-300 font-mono text-base tracking-wide min-w-[45px] text-center" id="timer">0:00</div>
            <button id="btn-submit" disabled class="w-12 h-12 rounded-full bg-white/10 text-white/40 flex items-center justify-center transition-all duration-300 cursor-not-allowed">
                <i data-lucide="arrow-up" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <aside id="sidebar" class="fixed top-0 right-0 h-full w-full max-w-md bg-[#11131a]/98 backdrop-blur-xl border-l border-white/5 transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col justify-between shadow-2xl">
        <div class="p-6 border-b border-white/5 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <i data-lucide="sparkles" class="w-5 h-5 text-indigo-400"></i>
                <h3 class="font-semibold text-lg text-white">Ajustes com Llama 3.1 8B</h3>
            </div>
            <button id="close-sidebar" class="p-1.5 hover:bg-white/10 rounded-full text-slate-400 hover:text-white transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 text-sm">
            <div class="bg-white/5 border border-white/5 rounded-2xl p-4 text-slate-400">
                Grave um áudio primeiro. Em seguida, peça revisões ou faça perguntas sobre o texto diretamente aqui.
            </div>
        </div>

        <div class="p-4 border-t border-white/5 bg-black/25">
            <div class="relative flex items-center">
                <input type="text" id="chat-input" placeholder="Converse com o Llama sobre o texto..." class="w-full rounded-xl liquid-glass-input py-3 pl-4 pr-12 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 transition-colors">
                <button id="btn-send-chat" class="absolute right-2 p-2 text-indigo-400 hover:text-indigo-300 transition-colors">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <script>
        const GROQ_PROXY_PATH = "/api/groq-proxy";

        lucide.createIcons();
        let mediaRecorder, audioChunks = [], audioContext, analyser, dataArray, source, animationFrameId;
        let isRecording = false, startTime, timerInterval, recordedAudioBlob = null, currentTranscription = "";
        let chatContextHistory = [];

        const btnRecord = document.getElementById('btn-record');
        const iconRecord = document.getElementById('icon-record');
        const btnSubmit = document.getElementById('btn-submit');
        const canvas = document.getElementById('waveform-canvas');
        const canvasCtx = canvas.getContext('2d');
        const timerDisplay = document.getElementById('timer');
        const placeholderText = document.getElementById('placeholder-text');
        const transcriptionResult = document.getElementById('transcription-result');
        const loadingTranscription = document.getElementById('loading-transcription');
        const sidebar = document.getElementById('sidebar');
        const toggleSidebar = document.getElementById('toggle-sidebar');
        const closeSidebar = document.getElementById('close-sidebar');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const btnSendChat = document.getElementById('btn-send-chat');

        function setupCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            canvasCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        setupCanvas();
        window.addEventListener('resize', setupCanvas);

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function drawStaticWaveform() {
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            const barWidth = 3, gap = 3, barCount = 40;
            const middle = canvas.height / (2 * window.devicePixelRatio);
            canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            for (let i = 0; i < barCount; i++) {
                const distFromCenter = Math.abs(i - barCount / 2);
                const height = Math.max(4, 22 - distFromCenter * 1.1 + Math.sin(i * 0.5) * 4);
                const x = (i * (barWidth + gap)) + 10;
                drawRoundedRect(canvasCtx, x, middle - height / 2, barWidth, height, 1.5);
            }
        }
        drawStaticWaveform();

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius); ctx.lineTo(x, y + radius); ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath(); ctx.fill();
        }

        toggleSidebar.addEventListener('click', () => sidebar.classList.remove('translate-x-full'));
        closeSidebar.addEventListener('click', () => sidebar.classList.add('translate-x-full'));

        btnRecord.addEventListener('click', async () => {
            if (!isRecording) { await startRecording(); } else { stopRecording(); }
        });

        async function startRecording() {
            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    btnSubmit.removeAttribute('disabled');
                    btnSubmit.className = "w-12 h-12 rounded-full bg-white text-slate-900 flex items-center justify-center transition-all duration-300 shadow-lg cursor-pointer";
                };

                mediaRecorder.start();
                isRecording = true;
                btnRecord.className = "w-12 h-12 rounded-full bg-red-500 flex items-center justify-center text-white shadow-lg animate-pulse";
                iconRecord.setAttribute('data-lucide', 'square'); iconRecord.className = "w-4 h-4 fill-white";
                lucide.createIcons();

                startTime = Date.now();
                timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    timerDisplay.textContent = `${Math.floor(elapsed / 60)}:${elapsed % 60 < 10 ? '0' : ''}${elapsed % 60}`;
                }, 1000);

                visualizeAudio();
            } catch (err) { alert("Microfone inacessível."); }
        }

        function stopRecording() {
            if (!isRecording) return;
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            clearInterval(timerInterval);
            cancelAnimationFrame(animationFrameId);
            if (audioContext) audioContext.close();
            isRecording = false;
            btnRecord.className = "w-12 h-12 rounded-full bg-indigo-600 flex items-center justify-center text-white shadow-lg";
            iconRecord.setAttribute('data-lucide', 'play'); iconRecord.className = "w-5 h-5 fill-white ml-0.5";
            lucide.createIcons();
            drawStaticWaveform();
        }

        function visualizeAudio() {
            if (!isRecording) return;
            animationFrameId = requestAnimationFrame(visualizeAudio);
            analyser.getByteFrequencyData(dataArray);
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            for (let i = 0; i < 35; i++) {
                let barHeight = (dataArray[i % dataArray.length] / 255.0) * 38;
                drawRoundedRect(canvasCtx, (i * 6) + 20, (canvas.height / (2 * window.devicePixelRatio)) - Math.max(4, barHeight) / 2, 3, Math.max(4, barHeight), 1.5);
            }
        }

        // Envio direto do navegador para os Endpoints Oficiais da Groq
        btnSubmit.addEventListener('click', async () => {
            if (!recordedAudioBlob) return;
            placeholderText.classList.add('hidden');
            transcriptionResult.classList.add('hidden');
            loadingTranscription.classList.remove('hidden');
            btnSubmit.setAttribute('disabled', 'true');
            btnSubmit.className = "w-12 h-12 rounded-full bg-white/10 text-white/40 flex items-center justify-center cursor-not-allowed";

            try {
                const arrayBuffer = await recordedAudioBlob.arrayBuffer();
                const audioBase64 = arrayBufferToBase64(arrayBuffer);

                const whisperResponse = await fetch(GROQ_PROXY_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requestType: 'transcription',
                        model: 'whisper-large-v3-turbo',
                        filename: 'audio.webm',
                        mimeType: 'audio/webm',
                        data: audioBase64
                    })
                });

                if (!whisperResponse.ok) {
                    const errorPayload = await whisperResponse.json().catch(() => null);
                    throw new Error(errorPayload?.error || "Falha no Whisper");
                }
                const whisperData = await whisperResponse.json();
                const textCru = whisperData.text;

                // 2. Enviar texto bruto para o Llama 3.1 8B formatar em Markdown elegante
                const llamaResponse = await fetch(GROQ_PROXY_PATH, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        requestType: 'chat',
                        model: 'llama-3.1-8b-instant',
                        messages: [
                            {
                                role: 'system',
                                content: 'Você é um assistente especialista em redação. Pegue o texto transcrito fornecido e organize-o com uma estrutura profissional em Markdown: use títulos apropriados, parágrafos fluidos, pontos cruciais em negrito e listas de tópicos onde couber. Retorne exclusivamente o texto revisado em português.'
                            },
                            { role: 'user', content: textCru }
                        ]
                    })
                });

                if(!llamaResponse.ok) throw new Error("Falha no Llama");
                const llamaData = await llamaResponse.json();
                const textEstruturado = llamaData.choices[0].message.content;

                currentTranscription = textEstruturado;
                
                // Definindo a memória base do Chat com o texto de conhecimento em anexo
                chatContextHistory = [
                    { 
                        role: "system", 
                        content: `Você é um copiloto de edição inteligente. O usuário acabou de transcrever um áudio. O texto completo e atual da transcrição é este abaixo:\n\n"""\n${currentTranscription}\n"""\n\nSua tarefa é responder a perguntas do usuário sobre este texto ou alterá-lo seguindo as instruções dadas. Sempre retorne o texto Markdown completo atualizado após as edições solicitadas.` 
                    }
                ];

                transcriptionResult.innerHTML = marked.parse(currentTranscription);
                loadingTranscription.classList.add('hidden');
                transcriptionResult.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                loadingTranscription.classList.add('hidden');
                placeholderText.classList.remove('hidden');
                alert("Erro ao processar na API da Groq. Verifique a sua chave.");
            } finally {
                timerDisplay.textContent = "0:00";
                recordedAudioBlob = null;
            }
        });

        btnSendChat.addEventListener('click', sendMessageToChat);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessageToChat(); });

        async function sendMessageToChat() {
            const prompt = chatInput.value.trim();
            if (!prompt) return;

            appendChatMessage("Você", prompt, "bg-indigo-600/20 text-indigo-200 ml-auto max-w-[85%]");
            chatInput.value = "";
            const loader = appendChatMessage("Groq", "Processando com Llama 3.1...", "bg-white/5 text-slate-400 animate-pulse");

            try {
                chatContextHistory.push({ role: "user", content: prompt });

                const response = await fetch(GROQ_PROXY_PATH, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        requestType: 'chat',
                        model: 'llama-3.1-8b-instant',
                        messages: chatContextHistory
                    })
                });

                if(!response.ok) throw new Error("Erro no Chat Llama");
                const data = await response.json();
                const respostaTexto = data.choices[0].message.content;

                loader.remove();
                appendChatMessage("Groq", "Texto processado!", "bg-emerald-500/10 text-emerald-400");
                
                chatContextHistory.push({ role: "assistant", content: respostaTexto });

                // Atualiza dinamicamente a tela principal com o Markdown modificado/explicado pelo Llama
                currentTranscription = respostaTexto;
                transcriptionResult.innerHTML = marked.parse(respostaTexto);

            } catch (e) {
                console.error(e);
                loader.remove();
                appendChatMessage("Erro", "Falha ao consultar o Llama 3.1.", "bg-red-500/10 text-red-400");
            }
        }

        function appendChatMessage(sender, text, classes) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `p-3 rounded-xl mb-2 text-xs border border-white/5 ${classes}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> <span class="block mt-1">${text}</span>`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
