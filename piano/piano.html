<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Virtual</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --piano-bg: #1f2937;
            --white-key: #ffffff;
            --black-key: #111827;
            --active-white: #e5e7eb;
            --active-black: #374151;
            --accent: #6366f1;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Botão Voltar */
        .back-button {
            position: absolute;
            top: 2rem;
            left: 2rem;
            text-decoration: none;
            color: var(--piano-bg);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.2s ease;
        }

        .back-button:hover {
            transform: translateX(-5px);
            color: var(--accent);
        }

        /* Container do Piano */
        .piano-container {
            background-color: var(--piano-bg);
            padding: 3rem 2rem 1rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            position: relative;
        }

        .piano-keys {
            display: flex;
            position: relative;
        }

        /* Teclas Brancas */
        .key {
            width: 60px;
            height: 220px;
            background: var(--white-key);
            border: 1px solid #d1d5db;
            border-radius: 0 0 8px 8px;
            cursor: pointer;
            z-index: 1;
            transition: background 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 1rem;
            color: #9ca3af;
            font-size: 0.75rem;
            user-select: none;
        }

        .key:active, .key.active {
            background: var(--active-white);
            height: 218px;
        }

        /* Teclas Pretas */
        .key.black {
            width: 40px;
            height: 130px;
            background: var(--black-key);
            margin-left: -20px;
            margin-right: -20px;
            z-index: 2;
            border: none;
            color: #4b5563;
        }

        .key.black:active, .key.black.active {
            background: var(--active-black);
            height: 128px;
        }

        /* Dica de Título */
        .title {
            position: absolute;
            top: -50px;
            left: 0;
            color: var(--piano-bg);
            font-weight: 600;
            letter-spacing: -0.025em;
        }
    </style>
</head>
<body>

    <a href="../index.html" class="back-button">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Voltar
    </a>

    <div class="piano-container">
        <div class="title">Piano Virtual</div>
        <div class="piano-keys">
            <!-- Teclas (Atribuídas a frequências no JS) -->
            <div class="key" data-note="261.63" data-key="A">A</div>
            <div class="key black" data-note="277.18" data-key="W">W</div>
            <div class="key" data-note="293.66" data-key="S">S</div>
            <div class="key black" data-note="311.13" data-key="E">E</div>
            <div class="key" data-note="329.63" data-key="D">D</div>
            <div class="key" data-note="349.23" data-key="F">F</div>
            <div class="key black" data-note="369.99" data-key="R">R</div>
            <div class="key" data-note="392.00" data-key="G">G</div>
            <div class="key black" data-note="415.30" data-key="T">T</div>
            <div class="key" data-note="440.00" data-key="H">H</div>
            <div class="key black" data-note="466.16" data-key="Y">Y</div>
            <div class="key" data-note="493.88" data-key="J">J</div>
            <div class="key" data-note="523.25" data-key="K">K</div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playNote(frequency) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'triangle'; // Som mais suave que 'sine' ou 'square'
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 1);
        }

        const keys = document.querySelectorAll('.key');

        keys.forEach(key => {
            key.addEventListener('mousedown', () => {
                playNote(parseFloat(key.dataset.note));
            });
        });

        // Suporte ao teclado do computador
        window.addEventListener('keydown', (e) => {
            const keyChar = e.key.toUpperCase();
            const keyElement = document.querySelector(`.key[data-key="${keyChar}"]`);
            
            if (keyElement) {
                keyElement.classList.add('active');
                playNote(parseFloat(keyElement.dataset.note));
            }
        });

        window.addEventListener('keyup', (e) => {
            const keyChar = e.key.toUpperCase();
            const keyElement = document.querySelector(`.key[data-key="${keyChar}"]`);
            if (keyElement) keyElement.classList.remove('active');
        });
    </script>
</body>
</html>
