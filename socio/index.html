<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>saBOR Slide</title>
    <!-- Tailwind CSS para estruturação rápida e limpa -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #000000;
        }
        /* Transição suave e premium entre as imagens dos slides */
        .slide-transition {
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Esconder barras de rolagem por segurança */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between overflow-hidden select-none">

    <!-- Zonas de clique/toque invisíveis para garantir navegabilidade em qualquer dispositivo sem quebrar o design clean -->
    <div id="tap-left" class="fixed left-0 top-0 w-[30%] h-full z-30 cursor-default" title="Voltar slide"></div>
    <div id="tap-right" class="fixed right-0 top-0 w-[70%] h-full z-30 cursor-default" title="Avançar slide"></div>

    <!-- Main Presentation Container (Apenas as imagens, 100% limpo) -->
    <main class="relative flex-grow w-full h-full flex items-center justify-center z-10">
        
        <!-- Slide 1: Imagem 1.png (Cover / Tela Cheia) -->
        <div class="slide slide-transition absolute inset-0 w-full h-full opacity-100 z-10 flex items-center justify-center">
            <div class="w-full h-full bg-cover bg-center bg-no-repeat" style="background-image: url('1.png');"></div>
        </div>

        <!-- Slide 2: Imagem 2.png (Cover / Tela Cheia) -->
        <div class="slide slide-transition absolute inset-0 w-full h-full opacity-0 z-0 flex items-center justify-center">
            <div class="w-full h-full bg-cover bg-center bg-no-repeat" style="background-image: url('2.png');"></div>
        </div>

        <!-- Slide 3: Imagem 3.png (Proporção Preservada / Contain com fundo preto) -->
        <div class="slide slide-transition absolute inset-0 w-full h-full opacity-0 z-0 flex items-center justify-center bg-black">
            <div class="w-full h-full bg-contain bg-center bg-no-repeat" style="background-image: url('3.png');"></div>
        </div>

    </main>

    <!-- Elementos de Áudio -->
    <audio id="audio-1" src="1.mp3" loop></audio>
    <audio id="audio-3" src="3.mp3" loop></audio>
    <audio id="audio-4" src="4.mp3" loop></audio>

    <script>
        const slides = document.querySelectorAll('.slide');
        const tapLeft = document.getElementById('tap-left');
        const tapRight = document.getElementById('tap-right');

        // Mapeamento das trilhas para as teclas 1, 2 e 3
        const soundMap = {
            1: { element: document.getElementById('audio-1'), playing: false }, // 1.mp3
            2: { element: document.getElementById('audio-3'), playing: false }, // 3.mp3
            3: { element: document.getElementById('audio-4'), playing: false }  // 4.mp3
        };

        let currentSlide = 0;

        // Atualiza a opacidade e visibilidade dos slides nos bastidores
        function updateSlide() {
            slides.forEach((slide, index) => {
                slide.classList.remove('opacity-100', 'z-10');
                slide.classList.add('opacity-0', 'z-0');
                if (index === currentSlide) {
                    slide.classList.remove('opacity-0', 'z-0');
                    slide.classList.add('opacity-100', 'z-10');
                }
            });
        }

        // Toca ou pausa uma trilha silenciosamente nos bastidores
        function toggleTrack(trackId) {
            const track = soundMap[trackId];
            if (!track) return;

            if (track.playing) {
                track.element.pause();
                track.playing = false;
            } else {
                // Interrompe qualquer outro som tocando para não sobrepor as músicas
                stopAllTracks();

                track.element.currentTime = 0;
                const playPromise = track.element.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        track.playing = true;
                    }).catch(error => {
                        console.log("Para reproduzir áudio pela primeira vez, interaja com a página antes.", error);
                    });
                }
            }
        }

        // Para todas as trilhas imediatamente
        function stopAllTracks() {
            Object.keys(soundMap).forEach(id => {
                soundMap[id].element.pause();
                soundMap[id].playing = false;
            });
        }

        // Avançar o slide (Apenas navegação visual, sem interferir no áudio)
        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlide();
            }
        }

        // Voltar o slide (Apenas navegação visual, sem interferir no áudio)
        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            }
        }

        // Controles de clique ocultos (Suporte Mobile / Apresentação sem teclado)
        tapLeft.addEventListener('click', prevSlide);
        tapRight.addEventListener('click', nextSlide);

        // Suporte total ao teclado (Setas e Números de atalho)
        document.addEventListener('keydown', (e) => {
            // Setas direcionais para controle de slide (<- e ->)
            if (e.key === 'ArrowRight') {
                nextSlide();
            }
            if (e.key === 'ArrowLeft') {
                prevSlide();
            }

            // Teclas de atalho numéricas de 1 a 3 para controle de áudio global independente do slide
            if (e.key === '1') {
                toggleTrack(1);
            }
            if (e.key === '2') {
                toggleTrack(2);
            }
            if (e.key === '3') {
                toggleTrack(3);
            }
        });

        // Configuração inicial ao abrir a página
        window.onload = function() {
            updateSlide();
        }
    </script>
</body>
</html>
