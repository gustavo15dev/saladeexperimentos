<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saBOR Slide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .slide-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .slide.active {
            opacity: 1;
            z-index: 10;
        }

        .slide-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .slide-content.contain-image {
            background-size: contain;
            background-position: center;
        }

        .slide-text {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            text-align: center;
            padding: 2rem;
        }

        .navigation {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 20;
        }

        .nav-arrow {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
            color: white;
        }

        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.9);
            transform: scale(1.1);
        }

        .nav-arrow:active {
            transform: scale(0.95);
        }

        .nav-arrow.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-arrow.disabled:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1);
        }

        .page-indicator {
            position: absolute;
            top: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            z-index: 20;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <!-- Slide 1: Imagem -->
        <div class="slide active">
            <div class="slide-content" id="slide-image" style="background-image: url('1.png');"></div>
        </div>

        <!-- Slide 2: Imagem -->
        <div class="slide">
            <div class="slide-content" style="background-image: url('2.png');"></div>
        </div>

        <!-- Slide 3: Imagem -->
        <div class="slide">
            <div class="slide-content contain-image" style="background-image: url('3.png');"></div>
        </div>

        <!-- Navegação -->
        <div class="navigation">
            <button class="nav-arrow" id="prev-arrow" title="Anterior">←</button>
            <button class="nav-arrow" id="next-arrow" title="Próxima">→</button>
        </div>

        <!-- Indicador de página -->
        <div class="page-indicator" id="page-indicator">1 / 3</div>
    </div>

    <!-- Áudio -->
    <audio id="audio-1" src="1.mp3"></audio>
    <audio id="audio-3" src="3.mp3"></audio>

    <script>
        const slides = document.querySelectorAll('.slide');
        const prevArrow = document.getElementById('prev-arrow');
        const nextArrow = document.getElementById('next-arrow');
        const pageIndicator = document.getElementById('page-indicator');
        const audio1 = document.getElementById('audio-1');
        const audio3 = document.getElementById('audio-3');

        let currentSlide = 0;
        let musicPlaying = false;
        let musicPlayingSlide3 = false;

        function updateSlide() {
            slides.forEach((slide, index) => {
                slide.classList.remove('active');
                if (index === currentSlide) {
                    slide.classList.add('active');
                }
            });

            pageIndicator.textContent = `${currentSlide + 1} / ${slides.length}`;

            // Atualizar estado dos botões
            prevArrow.classList.toggle('disabled', currentSlide === 0);
            nextArrow.classList.toggle('disabled', currentSlide === slides.length - 1);
        }

        function nextSlide() {
            // Lógica para slide 1 (índice 0)
            if (currentSlide === 0) {
                if (!musicPlaying) {
                    // Primeiro clique: toca música
                    audio1.currentTime = 0;
                    audio1.play();
                    musicPlaying = true;
                } else {
                    // Segundo clique: para música e avança
                    audio1.pause();
                    musicPlaying = false;
                    currentSlide++;
                    updateSlide();
                }
            }
            // Lógica para slide 3 (índice 2)
            else if (currentSlide === 2) {
                if (!musicPlayingSlide3) {
                    // Primeiro clique: toca música
                    audio3.currentTime = 0;
                    audio3.play();
                    musicPlayingSlide3 = true;
                } else {
                    // Segundo clique: para música e avança (se houver próximo slide)
                    audio3.pause();
                    musicPlayingSlide3 = false;
                    if (currentSlide < slides.length - 1) {
                        currentSlide++;
                        updateSlide();
                    }
                }
            }
            // Navegação normal para slide 2
            else if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                // Parar música se voltando de slide 3
                if (currentSlide === 2 && musicPlayingSlide3) {
                    audio3.pause();
                    musicPlayingSlide3 = false;
                }
                currentSlide--;
                updateSlide();
            }
        }

        // Event listeners
        nextArrow.addEventListener('click', nextSlide);
        prevArrow.addEventListener('click', prevSlide);

        // Navegação por teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        // Inicializar
        updateSlide();
    </script>
</body>
</html>
