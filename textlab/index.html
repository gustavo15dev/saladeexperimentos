<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextLab</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151b2c;
            --bg-input: #1e2640;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-success: #10b981;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .editor-zone {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 490px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-box { display: flex; flex-direction: column; }
        .stat-box .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .stat-box .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 600;
            color: #fff;
        }

        .tools-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tools-group h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            font-size: 0.82rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-active {
            background: rgba(99, 102, 241, 0.15) !important;
            border-color: var(--accent) !important;
            color: #a5b4fc !important;
            font-weight: 600;
        }

        .inline-inputs {
            display: flex;
            gap: 6px;
            margin-bottom: 4px;
        }

        .inline-inputs input {
            width: 50%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }
        .inline-inputs input:focus { border-color: var(--accent); }

        .btn-primary { background: var(--accent); border: none; font-weight: 600; }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent-success);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* --- MEDIAS QUERIES ESPECÍFICAS PARA CELULAR --- */
        @media (max-width: 600px) {
            body {
                padding: 12px;
                align-items: flex-start; /* Evita cortes em telas muito curtas */
            }

            .container {
                padding: 18px;
                border-radius: 10px;
            }

            header {
                margin-bottom: 20px;
            }

            header h1 {
                font-size: 1.45rem;
            }

            header p {
                font-size: 0.85rem;
            }

            textarea {
                height: 300px; /* Reduzido para não empurrar os botões excessivamente para baixo */
                padding: 14px;
                font-size: 0.95rem;
            }

            .control-panel {
                gap: 16px;
            }

            .stats-card {
                padding: 12px;
                gap: 10px;
            }

            .stat-box .value {
                font-size: 1rem;
            }

            .btn {
                padding: 11px 6px;
                font-size: 0.78rem; /* Evita quebra feia de palavras compridas */
            }

            .toast {
                bottom: 16px;
                right: 16px;
                left: 16px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Laboratório de Texto</h1>
            <p>Tratamento, limpeza e formatação inteligente de dados em tempo real com botões de reversão.</p>
        </header>

        <div class="workspace">
            <div class="editor-zone">
                <textarea id="input-text" placeholder="Cole ou digite seu texto bagunçado aqui..."></textarea>
            </div>

            <div class="control-panel">
                <div class="stats-card">
                    <div class="stat-box">
                        <span class="label">Caracteres</span>
                        <span id="char-count" class="value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Palavras</span>
                        <span id="word-count" class="value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Linhas</span>
                        <span id="line-count" class="value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Leitura Est.</span>
                        <span id="read-time" class="value">0s</span>
                    </div>
                </div>

                <div class="tools-group">
                    <h3>Localizar e Substituir</h3>
                    <div class="inline-inputs">
                        <input type="text" id="find-str" placeholder="Localizar...">
                        <input type="text" id="replace-str" placeholder="Substituir...">
                    </div>
                    <button class="btn" data-action="find-replace" style="width: 100%; background: rgba(255,255,255,0.03);">Substituir Tudo</button>
                </div>

                <div class="tools-group">
                    <h3>Caixa de Texto</h3>
                    <div class="tools-grid">
                        <button class="btn" data-action="upper">MAIÚSCULAS</button>
                        <button class="btn" data-action="lower">minúsculas</button>
                        <button class="btn" data-action="title">Título Inicial</button>
                        <button class="btn" data-action="sentence">Sentença livre</button>
                    </div>
                </div>

                <div class="tools-group">
                    <h3>Limpeza de Dados</h3>
                    <div class="tools-grid">
                        <button class="btn" data-action="clean-spaces">Limpar Espaços</button>
                        <button class="btn" data-action="remove-accents">Remover Acentos</button>
                        <button class="btn" data-action="remove-special">Remover Símbolos</button>
                        <button class="btn" data-action="remove-emojis">Remover Emojis</button>
                    </div>
                </div>

                <div class="tools-group">
                    <h3>Organização de Linhas</h3>
                    <div class="tools-grid">
                        <button class="btn" data-action="remove-duplicates">Remover Duplicadas</button>
                        <button class="btn" data-action="sort-lines">Ordenar (A-Z)</button>
                    </div>
                </div>

                <div class="tools-group" style="margin-top: auto; padding-top: 10px;">
                    <div class="tools-grid">
                        <button class="btn btn-primary" data-action="copy">Copiar Resultado</button>
                        <button class="btn btn-danger" data-action="clear">Limpar Tudo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Texto copiado com sucesso!</div>

    <script>
        const textarea = document.getElementById('input-text');
        const charCount = document.getElementById('char-count');
        const wordCount = document.getElementById('word-count');
        const lineCount = document.getElementById('line-count');
        const readTime = document.getElementById('read-time');
        const toast = document.getElementById('toast');

        const buttonStates = {
            upper: { originalText: '', active: false, normal: 'MAIÚSCULAS', activeLabel: '↩ Desfazer Alta' },
            lower: { originalText: '', active: false, normal: 'minúsculas', activeLabel: '↩ Desfazer Baixa' },
            title: { originalText: '', active: false, normal: 'Título Inicial', activeLabel: '↩ Desfazer Título' },
            sentence: { originalText: '', active: false, normal: 'Sentença livre', activeLabel: '↩ Desfazer Sentença' },
            'clean-spaces': { originalText: '', active: false, normal: 'Limpar Espaços', activeLabel: '↩ Trazer Espaços' },
            'remove-accents': { originalText: '', active: false, normal: 'Remover Acentos', activeLabel: '↩ Trazer Acentos' },
            'remove-special': { originalText: '', active: false, normal: 'Remover Símbolos', activeLabel: '↩ Trazer Símbolos' },
            'remove-emojis': { originalText: '', active: false, normal: 'Remover Emojis', activeLabel: '↩ Trazer Emojis' },
            'remove-duplicates': { originalText: '', active: false, normal: 'Remover Duplicadas', activeLabel: '↩ Restaurar Linhas' },
            'sort-lines': { originalText: '', active: false, normal: 'Ordenar (A-Z)', activeLabel: '↩ Desordenar' },
            'find-replace': { originalText: '', active: false, normal: 'Substituir Tudo', activeLabel: '↩ Desfazer Troca' }
        };

        textarea.addEventListener('input', () => {
            resetAllButtons();
            updateStats();
        });

        function resetAllButtons() {
            document.querySelectorAll('.btn').forEach(button => {
                const action = button.getAttribute('data-action');
                if (buttonStates[action] && buttonStates[action].active) {
                    buttonStates[action].active = false;
                    button.innerText = buttonStates[action].normal;
                    button.classList.remove('btn-active');
                }
            });
        }

        function updateStats() {
            const text = textarea.value;
            charCount.innerText = text.length;

            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCount.innerText = words;

            const lines = text ? text.split('\n').length : 0;
            lineCount.innerText = lines;

            if(words > 0) {
                const totalSeconds = Math.ceil((words / 200) * 60);
                readTime.innerText = totalSeconds < 60 ? `${totalSeconds}s` : `${Math.floor(totalSeconds / 60)} min`;
            } else {
                readTime.innerText = "0s";
            }
        }

        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.getAttribute('data-action');
                if (!action || action === 'copy' || action === 'clear') return;

                const state = buttonStates[action];
                if (!state) return;

                if (state.active) {
                    textarea.value = state.originalText;
                    state.active = false;
                    button.innerText = state.normal;
                    button.classList.remove('btn-active');
                    updateStats();
                } 
                else {
                    const currentText = textarea.value;
                    if (!currentText) return;

                    switch(action) {
                        case 'upper': textarea.value = currentText.toUpperCase(); break;
                        case 'lower': textarea.value = currentText.toLowerCase(); break;
                        case 'title': textarea.value = currentText.toLowerCase().replace(/(?:^|\s)\S/g, a => a.toUpperCase()); break;
                        case 'sentence': textarea.value = currentText.toLowerCase().replace(/(^\s*|[.!?]\s+)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase()); break;
                        case 'clean-spaces': textarea.value = currentText.replace(/[ \t]+/g, ' ').replace(/\n\s*\n/g, '\n').trim(); break;
                        case 'remove-accents': textarea.value = currentText.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); break;
                        case 'remove-special': textarea.value = currentText.replace(/[^a-zA-Z0-9áéíóúàèìòùâêîôûãõçÁÉÍÓÚÀÈÌÒÙÂÊÎÔÛÃÕÇ\s.,!?;:()\-]/g, ''); break;
                        case 'remove-emojis': textarea.value = currentText.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDFFF])/g, ''); break;
                        case 'remove-duplicates': textarea.value = [...new Set(currentText.split('\n'))].join('\n'); break;
                        case 'sort-lines': textarea.value = currentText.split('\n').sort((a, b) => a.localeCompare(b)).join('\n'); break;
                        case 'find-replace': 
                            const findStr = document.getElementById('find-str').value;
                            const replaceStr = document.getElementById('replace-str').value;
                            if (!findStr) return;
                            textarea.value = currentText.replace(new RegExp(findStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), replaceStr);
                            break;
                    }

                    if (textarea.value !== currentText) {
                        state.originalText = currentText;
                        state.active = true;
                        button.innerText = state.activeLabel;
                        button.classList.add('btn-active');
                    }
                    updateStats();
                }
            });
        });

        document.querySelector('[data-action="copy"]').addEventListener('click', () => {
            if (!textarea.value) return;
            navigator.clipboard.writeText(textarea.value).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            });
        });

        document.querySelector('[data-action="clear"]').addEventListener('click', () => {
            textarea.value = '';
            resetAllButtons();
            updateStats();
        });
    </script>
</body>
</html>
