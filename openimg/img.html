<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenImage | Sua fonte de inspiração</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: white;
            overflow-x: hidden;
            margin: 0;
        }

        /* Fundo em Grade de Imagens (Mosaico) - AJUSTADO PARA MAIOR VISIBILIDADE */
        #backgroundContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            padding: 10px;
            /* Aumentado o brilho de 0.25 para 0.55 e removido o blur para maior nitidez */
            filter: brightness(0.55) contrast(1.1);
            overflow: hidden;
        }

        .bg-tile {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* Camada de Gradiente para Escurecer - SUAVIZADA */
        .scrim {
            position: fixed;
            inset: 0;
            /* Gradiente mais transparente no topo para ver as imagens melhor */
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7));
            z-index: 0;
        }

        /* Grid Estilo Pinterest (Masonry) para Resultados */
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-auto-rows: 10px;
            gap: 16px;
        }

        .masonry-item {
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a1a;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .masonry-item:hover {
            transform: scale(1.03);
            z-index: 10;
        }

        .masonry-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Modal Customizado */
        #modal {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.6s ease-out forwards; }
    </style>
</head>
<body class="antialiased">

    <!-- Container do Mosaico de Fundo -->
    <div id="backgroundContainer"></div>
    <div class="scrim"></div>

    <!-- Interface de Busca Inicial -->
    <div id="heroSection" class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 transition-all duration-700">
        <h1 class="text-6xl md:text-8xl font-black mb-12 tracking-tighter text-white text-center drop-shadow-2xl">
            OpenImage
        </h1>
        
        <div class="w-full max-w-2xl relative group">
            <div class="absolute left-6 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-black transition-colors z-20">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <input 
                id="searchInput"
                type="text" 
                placeholder="O que você está procurando hoje?"
                class="w-full bg-white/20 backdrop-blur-xl border border-white/30 hover:bg-white/30 focus:bg-white focus:text-black transition-all outline-none pl-16 pr-6 py-6 rounded-2xl text-xl shadow-2xl text-white placeholder-gray-200 relative z-10"
            >
        </div>
        <p class="mt-8 text-gray-300 font-medium tracking-wide uppercase text-sm">Sua fonte infinita de inspiração</p>
    </div>

    <!-- Header fixo (oculto inicialmente) -->
    <header id="fixedHeader" class="fixed top-0 left-0 right-0 z-50 p-4 bg-black/90 backdrop-blur-lg border-b border-white/10 hidden items-center gap-6">
        <h2 class="text-2xl font-black tracking-tighter cursor-pointer" onclick="location.reload()">OI</h2>
        <div class="relative flex-1 max-w-xl">
            <input 
                id="headerSearchInput"
                type="text" 
                placeholder="Buscar novas imagens..."
                class="w-full bg-white/10 border border-white/10 pl-10 pr-4 py-2 rounded-xl outline-none focus:bg-white focus:text-black transition-all text-white"
            >
            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
        </div>
    </header>

    <!-- Galeria de Resultados -->
    <main id="mainContent" class="relative z-10 px-4 md:px-10 py-24 hidden bg-black">
        <div id="resultsTitle" class="mb-10">
            <h3 class="text-3xl font-bold text-white/90" id="queryDisplay">Resultados</h3>
        </div>
        
        <div id="imageGrid" class="masonry-grid"></div>

        <div id="loader" class="hidden flex justify-center py-20">
            <div class="w-10 h-10 border-4 border-white/10 border-t-white rounded-full animate-spin"></div>
        </div>
    </main>

    <!-- MODAL DE VISUALIZAÇÃO (SIMPLIFICADO) -->
    <div id="modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 cursor-zoom-out" onclick="closeModal()"></div>
        
        <div class="relative z-10 bg-[#0a0a0a] w-full max-w-6xl h-[85vh] rounded-3xl overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col md:row border border-white/10 animate-fade flex flex-col md:flex-row">
            
            <!-- Lado Esquerdo: Imagem Principal -->
            <div class="flex-1 bg-black flex items-center justify-center p-4 relative overflow-hidden">
                <img id="modalImg" src="" alt="" class="max-w-full max-h-full object-contain">
                
                <button onclick="closeModal()" class="absolute top-6 left-6 text-white/50 hover:text-white transition-colors p-2 bg-black/50 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"/></svg>
                </button>
            </div>

            <!-- Lado Direito: Informações e Relacionadas -->
            <div class="w-full md:w-80 lg:w-96 border-l border-white/10 flex flex-col bg-[#111] p-6 overflow-hidden">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex flex-col">
                        <span class="text-xs text-gray-500 uppercase tracking-widest font-bold">Fotógrafo</span>
                        <span id="photographerName" class="font-bold text-white truncate text-lg"></span>
                    </div>
                    <button id="downloadBtn" class="bg-white text-black p-3 rounded-xl hover:bg-gray-200 transition-colors flex items-center gap-2 font-black">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download
                    </button>
                </div>

                <h4 class="text-sm font-black text-gray-400 mb-4 uppercase tracking-widest">Mais como este</h4>
                <div id="relatedGrid" class="grid grid-cols-2 gap-2 overflow-y-auto custom-scroll pr-1 flex-1">
                    <!-- Dinâmico -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "uboCbHA0sVIhkZML6kIY8sHYpIRICMaMEmwzpa8okIInoMSVlmuAnhy3";
        const backgroundContainer = document.getElementById('backgroundContainer');
        const searchInput = document.getElementById('searchInput');
        const headerSearchInput = document.getElementById('headerSearchInput');
        const heroSection = document.getElementById('heroSection');
        const fixedHeader = document.getElementById('fixedHeader');
        const mainContent = document.getElementById('mainContent');
        const imageGrid = document.getElementById('imageGrid');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const relatedGrid = document.getElementById('relatedGrid');
        const downloadBtn = document.getElementById('downloadBtn');
        const photographerName = document.getElementById('photographerName');

        // 1. Gerar Grade de Fundo (Mosaico de Árvores)
        async function setupBackgroundGrid() {
            try {
                const res = await fetch(`https://api.pexels.com/v1/search?query=trees+forest&per_page=40&size=medium`, {
                    headers: { Authorization: API_KEY }
                });
                const data = await res.json();
                
                backgroundContainer.innerHTML = '';
                data.photos.forEach((photo, index) => {
                    const img = document.createElement('img');
                    img.src = photo.src.large;
                    img.className = 'bg-tile';
                    setTimeout(() => {
                        img.style.opacity = '1';
                    }, index * 50);
                    backgroundContainer.appendChild(img);
                });
            } catch (err) { console.error("Erro no fundo:", err); }
        }

        // 2. Sistema de Busca
        async function performSearch(query) {
            if (!query.trim()) return;

            heroSection.style.display = 'none';
            backgroundContainer.style.display = 'none';
            document.querySelector('.scrim').style.display = 'none';
            
            fixedHeader.classList.replace('hidden', 'flex');
            mainContent.classList.remove('hidden');
            document.getElementById('queryDisplay').innerText = `Explorando "${query}"`;
            document.body.style.backgroundColor = '#000';

            imageGrid.innerHTML = '';
            document.getElementById('loader').classList.remove('hidden');

            try {
                const res = await fetch(`https://api.pexels.com/v1/search?query=${query}&per_page=50`, {
                    headers: { Authorization: API_KEY }
                });
                const data = await res.json();
                renderImages(data.photos);
            } catch (err) {
                console.error("Erro na busca", err);
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function renderImages(photos) {
            photos.forEach(photo => {
                const item = document.createElement('div');
                const height = Math.floor(Math.random() * (400 - 250 + 1) + 250);
                const spans = Math.ceil(height / 12);
                
                item.className = 'masonry-item animate-fade';
                item.style.gridRowEnd = `span ${spans}`;
                
                item.innerHTML = `<img src="${photo.src.large}" loading="lazy" alt="${photo.alt}">`;
                item.onclick = () => openModal(photo);
                imageGrid.appendChild(item);
            });
        }

        // 3. Modal e Downloads
        async function openModal(photo) {
            modalImg.src = photo.src.large2x || photo.src.large;
            photographerName.innerText = photo.photographer;
            
            downloadBtn.onclick = () => downloadImage(photo.src.original, `OpenImage_${photo.id}.jpg`);

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            relatedGrid.innerHTML = '';
            try {
                const res = await fetch(`https://api.pexels.com/v1/curated?per_page=12&page=${Math.floor(Math.random() * 5) + 1}`, {
                    headers: { Authorization: API_KEY }
                });
                const data = await res.json();
                data.photos.forEach(p => {
                    const thumb = document.createElement('div');
                    thumb.className = 'aspect-[3/4] rounded-lg overflow-hidden cursor-pointer hover:opacity-50 transition-all bg-[#222]';
                    thumb.innerHTML = `<img src="${p.src.medium}" class="w-full h-full object-cover">`;
                    thumb.onclick = (e) => {
                        e.stopPropagation();
                        openModal(p);
                    };
                    relatedGrid.appendChild(thumb);
                });
            } catch (err) { console.error(err); }
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch (err) {
                window.open(url, '_blank');
            }
        }

        searchInput.addEventListener('keypress', e => e.key === 'Enter' && performSearch(e.target.value));
        headerSearchInput.addEventListener('keypress', e => e.key === 'Enter' && performSearch(e.target.value));

        window.onload = setupBackgroundGrid;
    </script>
</body>
</html>
