<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenImage | Sua fonte de inspiração</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            transition: background-color 0.5s ease;
        }

        /* Efeito Liquid Glass */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        /* Estilo Masonry */
        .masonry-grid {
            columns: 2;
            column-gap: 1.5rem;
        }
        @media (min-width: 768px) { .masonry-grid { columns: 3; } }
        @media (min-width: 1280px) { .masonry-grid { columns: 4; } }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            cursor: pointer;
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .masonry-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        /* Estado Inicial (Busca Centralizada) */
        #searchContainer.initial {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            text-align: center;
            z-index: 50;
        }

        #searchContainer.initial h1 {
            display: block;
        }

        #searchContainer.active {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 24px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 50;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }

        #searchContainer.active h1 {
            display: none;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #000;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased overflow-x-hidden">

    <!-- Container de Busca (Dinâmico) -->
    <div id="searchContainer" class="initial transition-all duration-700">
        <h1 class="text-5xl font-black mb-8 tracking-tighter text-black flex items-center justify-center gap-3">
            <span class="w-12 h-12 bg-black text-white rounded-2xl flex items-center justify-center text-3xl">O</span>
            OpenImage
        </h1>
        <div class="relative w-full group">
            <div class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-black transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <input 
                id="searchInput"
                type="text" 
                placeholder="Busque por qualquer tema..."
                class="w-full bg-gray-100 group-hover:bg-gray-200 focus:bg-white focus:ring-4 focus:ring-black/5 transition-all outline-none pl-14 pr-6 py-4 rounded-3xl text-lg shadow-sm"
            >
        </div>
    </div>

    <!-- Main Content -->
    <main id="content" class="pt-24 px-6 md:px-12 opacity-0 transition-opacity duration-1000">
        <div id="loading" class="hidden flex flex-col items-center justify-center py-20 text-gray-500 gap-4">
            <div class="loader"></div>
            <p class="font-medium animate-pulse">Buscando as melhores imagens...</p>
        </div>

        <div id="imageGrid" class="masonry-grid"></div>
    </main>

    <!-- MODAL DE DETALHES -->
    <div id="modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
        
        <div class="glass-card w-full max-w-6xl max-h-[92vh] rounded-[40px] overflow-hidden relative flex flex-col md:flex-row animate-in fade-in zoom-in duration-300">
            
            <button onclick="closeModal()" class="absolute top-6 left-6 z-10 p-3 bg-white/90 backdrop-blur rounded-full shadow-xl hover:bg-white transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>

            <!-- Esquerda: Imagem -->
            <div class="w-full md:w-[60%] bg-[#f8fafc] flex items-center justify-center p-6 relative">
                <img id="modalImg" src="" alt="Destaque" class="w-full max-h-[70vh] object-contain rounded-3xl shadow-2xl">
                
                <div class="absolute bottom-8 right-8 flex flex-col gap-3">
                    <button class="p-4 bg-white/90 backdrop-blur rounded-full shadow-lg hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
                    </button>
                    <button class="p-4 bg-white/90 backdrop-blur rounded-full shadow-lg hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><path d="M21 3v6h-6"/><path d="M21 3l-6 6"/></svg>
                    </button>
                </div>
            </div>

            <!-- Direita: Info -->
            <div class="w-full md:w-[40%] bg-white p-10 flex flex-col gap-8 overflow-y-auto">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-1 font-bold text-lg"><svg class="text-red-500" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> <span id="likeCount">0</span></div>
                        <button class="p-2 hover:bg-gray-100 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
                        <button class="p-2 hover:bg-gray-100 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button>
                    </div>
                    <div class="flex gap-2">
                        <button class="px-5 py-2.5 font-semibold hover:bg-gray-100 rounded-full">Perfil</button>
                        <button class="px-8 py-2.5 bg-red-600 text-white font-bold rounded-full hover:bg-red-700 shadow-lg shadow-red-200">Salvar</button>
                    </div>
                </div>

                <div>
                    <h2 id="modalTitle" class="text-3xl font-black mb-4">Título da Imagem</h2>
                    <p id="modalDesc" class="text-gray-500 leading-relaxed text-lg">
                        Descubra a tecnologia e a arte por trás desta imagem incrível encontrada no OpenImage através da API Pexels.
                    </p>
                    <button class="mt-6 px-8 py-4 bg-black text-white font-black rounded-2xl hover:bg-zinc-800 transition-all flex items-center gap-3">
                        Get started <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </div>

                <div class="mt-auto border-t pt-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-black text-xl">Mais como este</h3>
                        <button class="bg-gray-100 hover:bg-gray-200 px-6 py-2.5 rounded-2xl text-sm font-bold">Acessar o site</button>
                    </div>
                    <div id="suggestionGrid" class="grid grid-cols-2 gap-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const pexelsKey = "uboCbHA0sVIhkZML6kIY8sHYpIRICMaMEmwzpa8okIInoMSVlmuAnhy3";
        const searchInput = document.getElementById('searchInput');
        const searchContainer = document.getElementById('searchContainer');
        const content = document.getElementById('content');
        const imageGrid = document.getElementById('imageGrid');
        const loading = document.getElementById('loading');
        
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const suggestionGrid = document.getElementById('suggestionGrid');

        async function searchImages(query) {
            if (!query) return;

            // Transição do Layout
            searchContainer.classList.replace('initial', 'active');
            content.classList.replace('opacity-0', 'opacity-100');
            loading.classList.remove('hidden');
            imageGrid.innerHTML = '';
            
            try {
                const response = await fetch(`https://api.pexels.com/v1/search?query=${query}&per_page=30`, {
                    headers: { Authorization: pexelsKey }
                });
                const data = await response.json();
                
                loading.classList.add('hidden');
                
                data.photos.forEach(photo => {
                    createItem(photo);
                });
            } catch (error) {
                console.error("Erro Pexels:", error);
                loading.innerText = "Erro ao buscar imagens. Verifique sua conexão.";
            }
        }

        function createItem(photo) {
            const div = document.createElement('div');
            div.className = 'masonry-item group relative glass-card p-0';
            div.innerHTML = `
                <img src="${photo.src.large}" class="w-full h-auto block">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent opacity-0 group-hover:opacity-100 transition-all p-5 flex flex-col justify-end">
                    <div class="flex justify-between items-center text-white">
                        <span class="font-bold truncate pr-4">${photo.photographer}</span>
                        <div class="bg-red-600 p-2 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></div>
                    </div>
                </div>
            `;
            div.onclick = () => openDetails(photo);
            imageGrid.appendChild(div);
        }

        async function openDetails(photo) {
            modalImg.src = photo.src.large;
            modalTitle.innerText = `Fotografia por ${photo.photographer}`;
            document.getElementById('likeCount').innerText = Math.floor(Math.random() * 1000);
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            // Buscar sugestões rápidas
            suggestionGrid.innerHTML = '';
            const resp = await fetch(`https://api.pexels.com/v1/curated?per_page=4`, {
                headers: { Authorization: pexelsKey }
            });
            const data = await resp.json();
            data.photos.forEach(p => {
                const thumb = document.createElement('div');
                thumb.className = 'aspect-[4/3] rounded-2xl overflow-hidden cursor-pointer hover:scale-95 transition-transform';
                thumb.innerHTML = `<img src="${p.src.medium}" class="w-full h-full object-cover">`;
                thumb.onclick = (e) => {
                    e.stopPropagation();
                    openDetails(p);
                };
                suggestionGrid.appendChild(thumb);
            });
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchImages(searchInput.value);
            }
        });
    </script>
</body>
</html>
